name: Homepage Verification Agent

on:
  # Run manually from GitHub Actions tab with a custom URL input
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to verify (leave blank for default https://www.cambridgeone.org/)'
        required: false
        default: 'https://www.cambridgeone.org/'

  # Run automatically every day at 8:00 AM UTC
  schedule:
    - cron: '0 8 * * *'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install chromium --with-deps

      - name: Run homepage verification agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET_URL: ${{ github.event.inputs.url || 'https://www.cambridgeone.org/' }}
        run: node tests/verifyHomepage-agent.js

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-screenshots
          path: tests/test-results/homepage-agent/
          retention-days: 7
